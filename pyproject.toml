[project]
name = "rag-control-cite"
version = "0.1.0"
description = "Multi-tenant document Q&A with enforced access control over public regulatory frameworks"
readme = "README.md"
authors = [{ name = "Steven Pequeno", email = "steven@pequeno.in" }]
requires-python = ">=3.14"
dependencies = [
    # data plane (LlamaIndex)
    "llama-index-core>=0.13",
    # control plane (LangGraph)
    "langgraph>=0.6",
    # embeddings + generation
    "openai>=3.19.2",
    # vector store (pgvector)
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # retrieval
    "bm25s>=0.3.11",
    "sentence-transformers>=6.1.0",
    # serving
    "fastapi>=0.118",
    "uvicorn>=0.34",
    # observability (OTEL)
    "opentelemetry-api>=0.32",
    "opentelemetry-sdk>=0.32",
    "opentelemetry-instrumentation-fastapi>=0.32",
    "opentelemetry-exporter-otlp-proto-http>=0.32",
    # config
    "pydantic-settings>=2.7",
]

[project.scripts]
rcc = "rag_control_cite.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
cdk = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]
dev = [
    "httpx>=0.28",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
extend-exclude = ["infra/cdk/cdk.out"]

[tool.pytest.ini_options]
testpaths = ["tests"]
